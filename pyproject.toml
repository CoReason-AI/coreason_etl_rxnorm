[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "coreason_etl_rxnorm"
dynamic = ["version"]
description = "ETL pipeline processing RxNorm standardized clinical drug names and vocabularies"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Akshaya M", email = "akshaya.movvar@coreason.ai" },
]
dependencies = [
    "adbc-driver-postgresql>=1.10.0",
    "awswrangler>=3.15.1",
    "boto3>=1.42.68",
    "dlt>=1.23.0 ; python_version < '3.14'",
    "loguru>=0.7.2",
    "polars>=1.39.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "requests>=2.32.5",
]
license = { file = "LICENSE" }
classifiers = [
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
]

[project.scripts]
coreason-etl-rxnorm = "coreason_etl_rxnorm.main:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.14",
    "pre-commit>=4.5.1",
    "pytest-cov>=7.0.0",
    "zensical",
    "mypy>=1.19.1",
    "pytest-asyncio",
    "pytest-benchmark",
    "deptry",
    "deepdiff",
    "hypothesis",
    "syrupy",
    "mkdocstrings-python",
    "types-pyyaml>=6.0.12.20250915",
    "tzdata>=2025.3",
    "pytest-xdist>=3.6.1",
    "responses>=0.26.0",
    "types-requests>=2.32.4.20260107",
    "moto>=5.1.22",
    "boto3-stubs[s3]>=1.42.68",
    "pyparsing>=3.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/coreason_etl_rxnorm"]

[tool.hatch.version]
source = "vcs"

[project.urls]
Homepage = "https://github.com/CoReason-AI/coreason_etl_rxnorm"
Repository = "https://github.com/CoReason-AI/coreason_etl_rxnorm"
Documentation = "https://github.com/CoReason-AI/coreason_etl_rxnorm"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "SIM", "RUF", "ARG", "C4", "PT", "TCH", "FA", "PIE", "RET", "PERF", "FURB", "LOG", "N", "A", "S"]
ignore = ["S101", "TC001", "TC002", "TC003", "UP037"]

[tool.mypy]
python_version = "3.14"
strict = true
disallow_untyped_defs = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
implicit_reexport = true

[tool.pytest.ini_options]
addopts = "-n auto --cov=src --cov-report=term-missing --cov-report=html --cov-fail-under=100"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
omit = ["tests/*"]
